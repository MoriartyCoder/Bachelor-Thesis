# =============================================================================
# Run configuration template
#
# Copy for each experiment:   cp configs/template.yaml configs/<experiment>.yaml
# Train:                      python src/main.py -c configs/<experiment>.yaml -t
# Quick check (CPU, tiny):    python src/main.py -c configs/<experiment>.yaml -t --dry-run
# Detailed log:               add -v (DEBUG); the log of every run is in <run folder>/run.log
# Continue an interrupted run: python src/main.py -r weights/<YYYYMMDD-HHMMSS>_<config name>
# Robustness test of a finished run: python src/main.py -e weights/<YYYYMMDD-HHMMSS>_<config name>
# Compare runs:               notebooks/08_compare_runs.ipynb
# Test set (once, before the first run): python src/main.py -c configs/template.yaml --freeze-test
#
# Relative paths are resolved against the repository root.
# The file is copied into every run folder (config.yaml), together with the
# fully resolved version (config.resolved.yaml).
# =============================================================================

run:
  seed: 42                       # seeds python/numpy/torch, frame sampling and ultralytics
  deterministic: true            # reproducible cuDNN ops (slightly slower)
  output_root: weights           # run folder = <output_root>/<YYYYMMDD-HHMMSS>_<config name>/ (start time +
                                 # file name of this config without .yaml)
  checkpoint_every_n_epochs: 10  # extra snapshot weights/epoch<N>.pt every N epochs; -1 = off
                                 # (last.pt and best.pt are always written)
  test_after_training: true      # evaluate best.pt on the frozen test set -> test_metrics.json
                                 # (all frames, per dataset, per target size, false alarms on frames without target)
  test_set: configs/test_set.csv # frozen test frames, identical for every experiment; create ONCE with
                                 #   python src/main.py -c configs/template.yaml --freeze-test
  robustness_suite: null         # e.g. configs/robustness.yaml: after the test evaluation, evaluate best.pt
                                 # on corrupted copies of the test frames -> robustness_metrics.json
                                 # (diagnosis only; needs test_after_training; checked before training)

# -----------------------------------------------------------------------------
# Datasets. The same split of all datasets is combined:
#   train = <root>/train of every dataset, val = <root>/val, test = <root>/test
# A dataset whose split folder does not exist is skipped with a warning
# (archives are never extracted automatically; use `python src/main.py -p ...`).
#
# name:   a value of config.DatasetName: Anti-UAV410 | CST-AntiUAV
#         (new dataset -> add a member to DatasetName in src/config.py)
# root:   optional, default data/<name>
# format: name of a loader in src/data_handler/formats.py
#   default  -> <split>/<seq>/000001.jpg + IR_label.json  (Anti-UAV410, CST-AntiUAV)
#   (add new layouts with @register_format("<name>"), e.g. "company")
# -----------------------------------------------------------------------------
datasets:
  - name: CST-AntiUAV
    format: default
    enabled: true
  - name: Anti-UAV410
    format: default
    enabled: true

# -----------------------------------------------------------------------------
# Frame sampling per split (sequences are not used as sequences, only as frames).
# method: name of a sampler in src/data_handler/sampling.py
#   stride_fraction -> keep every <stride>-th frame of each sequence, then a random
#                      <fraction> (0, 1] of those (seeded by run.seed)
#   all             -> every frame
# -----------------------------------------------------------------------------
sampling:
  train: {method: stride_fraction, stride: 5, fraction: 1.0}
  val:   {method: stride_fraction, stride: 5, fraction: 1.0}
  test:  {method: stride_fraction, stride: 5, fraction: 1.0}   # only used by --freeze-test (frozen test set)

# -----------------------------------------------------------------------------
# Model
# -----------------------------------------------------------------------------
model:
  weights: yolo26n.yaml # pretrained: yolo26{n,s,m,l,x}.pt / yolo11n.pt ... (downloaded to weights/pretrained/)
                        # from scratch: yolo26n.yaml; or a path to an own .pt
  imgsz: 640            # training/eval image size (frames are 640x512)

# -----------------------------------------------------------------------------
# Training. Passed directly to Ultralytics (see docs.ultralytics.com/modes/train).
# NOT allowed here:
#   - Ultralytics augmentation keys (mosaic, fliplr, hsv_*, degrees, scale, mixup,
#     close_mosaic, ...): they are ALWAYS off; use the `augmentation:` section.
#   - model, data, imgsz, project, name, exist_ok, save_period, seed, deterministic:
#     set from the sections above.
# -----------------------------------------------------------------------------
train:
  epochs: 5
  batch: 16             # int, or -1 = AutoBatch (fit to GPU memory)
  device: auto          # auto -> first NVIDIA GPU (0) if CUDA available, else cpu; or 0 / "cpu"
  amp: true             # mixed precision on GPU
  workers: 8            # dataloader worker processes
  cache: false          # false / ram / disk
  optimizer: auto       # SGD, AdamW, Adam, ... or auto
  lr0: 0.01
  lrf: 0.01
  momentum: 0.937
  weight_decay: 0.0005
  warmup_epochs: 0.0
  cos_lr: false
  patience: 50          # early stopping after N epochs without val improvement
  plots: true

# -----------------------------------------------------------------------------
# Augmentation (Albumentations, applied to the training split only).
#
# Four sections, each only accepts the names of its registry:
#   sota        src/augmentations/sota.py        ACB, PGDAA (copy-paste of training targets)
#   default     src/augmentations/default.py     generic Albumentations transforms
#   edge_cases  src/augmentations/edge_cases.py  difficult detection cases (list still empty)
#   ir          src/augmentations/ir.py          IR camera effects
# order:   sequence of the sections; each section exactly once. Default: scene first
#          (copy-paste), camera last (IR).
# enabled: switches a section, a one_of group or a single entry on/off.
# Entry:   {name, enabled, p, params}
#            p:      probability per image
#            params: keyword arguments of the transform / effect function
# Group:   one_of: {enabled, p, pipeline: [entries]}
#            mutually exclusive (albumentations.OneOf): with probability p exactly ONE enabled
#            member runs; the members' p are only relative weights for which one is chosen.
#            Groups cannot be nested.
# Within a section the entries run in the listed order.
# Images are grayscale uint8 (0..255); every augmentation keeps them uint8 HxW.
#
# ACB: copy-paste of training targets (Tong et al. 2024, src/augmentations/sota.py):
#   crops a small training target (box area < max_area_ratio of the frame, default
#   0.0015 = 0.15 %; null = every box) with context, augments the patch with RandAugment
#   (num_ops ops from `ops`, magnitude 0..10) and blends it in at a random free spot
#   with I' = T'*T + (1-T')*I. Each paste gets its own box. Weight T' (`fusion`):
#     paper (default): T/max(T), the paper's Eq. 6 (on our data the patch rectangle stays partly visible)
#     background:      max(T-b, 0) / max(T-b), b = median grey value around the box (not in the paper)
#     none:            plain copy
#   fixed: true (default) = a frame gets the same pastes in every epoch (the paper's "initially
#   enriched" dataset, seeded from run.seed + frame); false = new pastes every epoch.
#   Grid-search num_ops x magnitude (the paper's "auto" part), one run per point.
#   Ablation "box copy only": num_ops: 0, fusion: none.
#   ops: identity rotate flip scale brightness sharpness (default) contrast color
#        shear_x shear_y posterize solarize autocontrast equalize
#
# PGDAA: PGDA adapted (Wang et al. 2022, src/augmentations/sota.py; needs `python src/main.py -l`).
#   With probability p the sample is REPLACED by a synthetic image: a random train frame without
#   target (B_O), with the subfigure split a random crop of it (side fraction crop_scale) resized to
#   the frame size, plus num_targets bright library targets. Each target: flips/affine, elastic/
#   grid/piecewise-affine distortion, scaled so its box area ratio is drawn from A (train boxes below
#   max_area_ratio, x U(1 +- area_jitter)), Gaussian paste (gaussian_sigma px), SCR perception
#   (SCR at the spot outside S = library SCR between scr_percentiles -> shifted to a random S value,
#   then ColorJitter). Boxes = only the pasted targets.
#   Offline synthesis ratio r of the paper <-> p = r / (1 + r)   (r = 1 -> p = 0.5).
#   Ablations (paper Table V): subfigure_split: false | scr_perception: false | gaussian_sigma: 0
#   Shape ops of the targets: target_ops (default DEFAULT_TARGET_OPS in sota.py).
#   ACB and PGDAA should not both be on: PGDAA replaces the image that ACB pasted into.
#
# IR effects (src/augmentations/ir.py), listed in the physical chain
# optics/motion -> sensor pattern -> temporal noise -> defect pixels:
#   optical_blur / motion_blur: anisotropic Gaussian PSF (blurring_with_psf: sigma_0, rho = sigma_1/sigma_0,
#                               theta in radians); optical: rho ~ 1, motion: rho < 1 (stretched along theta).
#                               The PSF is centred, so the image does not shift and the boxes stay exact.
#   fpn:          y = a*x + b (PRNU gain sigma_gain, DSNU offset sigma_offset in grey values), mode pixel|column|row
#   stripe_noise: one offset per column (sigma_offset in grey values)
#   netd:         temporal noise, sigma relative to [0, 1]
#   salt_and_pepper: p = share of 0-pixels, q = share of 255-pixels
#
# Grey-value histogram (default section, functions in src/augmentations/ir.py):
#   histogram_shift:       Y + delta, delta ~ U(-delta_limit, +delta_limit) grey values (level)
#   histogram_compression: Y_mid + gamma*(Y - Y_mid) around the median, gamma ~ U(gamma_min, gamma_max) (gain)
# -----------------------------------------------------------------------------
augmentation:
  bbox:
    min_visibility: 0.3   # drop a box if less than 30% of it remains after a spatial transform
    clip: true
  order: [sota, default, edge_cases, ir]

  sota:
    enabled: false
    pipeline:
      - {name: ACB, enabled: false, p: 1.0, params: {max_area_ratio: 0.0015, num_targets: 1, num_ops: 2, magnitude: 5, context: 1.0, min_context_px: 8, fusion: paper, fixed: true}}
      - name: PGDAA
        enabled: false
        p: 0.5
        params: {num_targets: 1, subfigure_split: true, crop_scale: [0.5, 1.0], max_area_ratio: 0.0015, area_jitter: 0.1,
                 scr_perception: true, scr_percentiles: [20, 80], d: 20, gaussian_sigma: 1.0,
                 color_jitter: {brightness: 0.1, contrast: 0.1}}

  default:
    enabled: false
    pipeline:
      # --- geometric ---
      - {name: HorizontalFlip, enabled: true,  p: 0.5}
      - {name: VerticalFlip,   enabled: false, p: 0.5}
      - {name: Affine,         enabled: false, p: 0.5, params: {scale: [0.8, 1.2], translate_percent: [-0.1, 0.1], rotate: [-10, 10]}}
      # --- photometric ---
      - {name: RandomBrightnessContrast, enabled: false, p: 0.5, params: {brightness_limit: 0.15, contrast_limit: 0.2}}
      - {name: GaussNoise,     enabled: false, p: 0.5, params: {std_range: [0.01, 0.05]}}
      - {name: GaussianBlur,   enabled: false, p: 0.3, params: {blur_limit: [3, 5]}}
      - {name: CLAHE,          enabled: false, p: 0.3, params: {clip_limit: 2.0, tile_grid_size: [8, 8]}}
      - {name: histogram_shift,       enabled: false, p: 0.3, params: {delta_limit: 30}}
      - {name: histogram_compression, enabled: false, p: 0.3, params: {gamma_min: 0.3, gamma_max: 0.9}}

  edge_cases:
    enabled: false
    pipeline: []          # list still to be decided

  ir:
    enabled: false
    pipeline:
      - one_of:           # only optical OR motion blur
          enabled: false
          p: 0.2
          pipeline:
            - {name: optical_blur, p: 1.0, params: {sigma_0: 1.2, rho: 1.0}}
            - {name: motion_blur,  p: 1.0, params: {sigma_0: 2.0, rho: 0.15, theta: 0.0}}
      - one_of:           # only FPN OR stripe noise
          enabled: false
          p: 0.3
          pipeline:
            - {name: fpn,          p: 1.0, params: {sigma_gain: 0.02, sigma_offset: 3.0, mode: pixel}}
            - {name: stripe_noise, p: 1.0, params: {sigma_offset: 3.0}}
      - {name: netd,            enabled: false, p: 0.3, params: {sigma: 0.0159}}
      - {name: salt_and_pepper, enabled: false, p: 0.2, params: {p: 0.005, q: 0.005}}
