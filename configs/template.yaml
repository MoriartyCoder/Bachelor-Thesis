# =============================================================================
# Run configuration template
#
# Copy for each experiment:   cp configs/template.yaml configs/<experiment>.yaml
# Train:                      python src/main.py -c configs/<experiment>.yaml -t
# Quick check (CPU, tiny):    python src/main.py -c configs/<experiment>.yaml -t --dry-run
# Detailed log:               add -v (DEBUG); the log of every run is in <run folder>/run.log
#
# Relative paths are resolved against the repository root.
# The file is copied into every run folder (config.yaml), together with the
# fully resolved version (config.resolved.yaml).
# =============================================================================

run:
  seed: 42                       # seeds python/numpy/torch, frame sampling and ultralytics
  deterministic: true            # reproducible cuDNN ops (slightly slower)
  output_root: weights           # run folder = <output_root>/<YYYYMMDD-HHMMSS>/ (start time)
  checkpoint_every_n_epochs: 10  # extra snapshot weights/epoch<N>.pt every N epochs; -1 = off
                                 # (last.pt and best.pt are always written)
  test_after_training: true      # evaluate best.pt on the combined test split -> test_metrics.json

# -----------------------------------------------------------------------------
# Datasets. The same split of all datasets is combined:
#   train = <root>/train of every dataset, val = <root>/val, test = <root>/test
# A dataset whose split folder does not exist is skipped with a warning
# (archives are never extracted automatically; use `python src/main.py -p ...`).
#
# name:   a value of config.DatasetName: Anti-UAV410 | CST-AntiUAV
#         (new dataset -> add a member to DatasetName in src/config.py)
# root:   optional, default data/<name>
# format: name of a loader in src/data_handler/formats.py
#   default  -> <split>/<seq>/000001.jpg + IR_label.json  (Anti-UAV410, CST-AntiUAV)
#   (add new layouts with @register_format("<name>"), e.g. "company")
# -----------------------------------------------------------------------------
datasets:
  - name: CST-AntiUAV
    format: default
    enabled: true
  - name: Anti-UAV410
    format: default
    enabled: true

# -----------------------------------------------------------------------------
# Frame sampling per split (sequences are not used as sequences, only as frames).
# method: name of a sampler in src/data_handler/sampling.py
#   stride_fraction -> keep every <stride>-th frame of each sequence, then a random
#                      <fraction> (0, 1] of those (seeded by run.seed)
#   all             -> every frame
# -----------------------------------------------------------------------------
sampling:
  train: {method: stride_fraction, stride: 5, fraction: 1.0}
  val:   {method: stride_fraction, stride: 5, fraction: 1.0}
  test:  {method: stride_fraction, stride: 5, fraction: 1.0}

# -----------------------------------------------------------------------------
# Model
# -----------------------------------------------------------------------------
model:
  weights: yolo26n.pt   # pretrained: yolo26{n,s,m,l,x}.pt / yolo11n.pt ... (downloaded to weights/pretrained/)
                        # from scratch: yolo26n.yaml; or a path to an own .pt
  imgsz: 640            # training/eval image size (frames are 640x512)

# -----------------------------------------------------------------------------
# Training. Passed directly to Ultralytics (see docs.ultralytics.com/modes/train).
# NOT allowed here:
#   - Ultralytics augmentation keys (mosaic, fliplr, hsv_*, degrees, scale, mixup,
#     close_mosaic, ...): they are ALWAYS off; use the `augmentation:` section.
#   - model, data, imgsz, project, name, exist_ok, save_period, seed, deterministic:
#     set from the sections above.
# -----------------------------------------------------------------------------
train:
  epochs: 100
  batch: 16             # int, or -1 = AutoBatch (fit to GPU memory)
  device: auto          # auto -> first NVIDIA GPU (0) if CUDA available, else cpu; or 0 / "cpu"
  amp: true             # mixed precision on GPU
  workers: 8            # dataloader worker processes
  cache: false          # false / ram / disk
  optimizer: auto       # SGD, AdamW, Adam, ... or auto
  lr0: 0.01
  lrf: 0.01
  momentum: 0.937
  weight_decay: 0.0005
  warmup_epochs: 3.0
  cos_lr: false
  patience: 50          # early stopping after N epochs without val improvement
  plots: true

# -----------------------------------------------------------------------------
# Augmentation (Albumentations, applied to the training split only).
# Entries run in the listed order. Switch each one with `enabled`.
#   name:   any albumentations transform (https://albumentations.ai/docs/reference/supported-targets-by-transform/)
#           or an IR sensor effect "ir.<effect>" from src/augmentations/ir_camara_effects.py:
#             ir.netd, ir.fpn, ir.psf_blur, ir.histogram_shift, ir.histogram_compression,
#             ir.salt_and_pepper
#             - stripe noise = ir.fpn with mode: column (offsets per column only)
#             - optical blur = ir.psf_blur with rho: 1 (isotropic),
#               motion blur  = ir.psf_blur with rho < 1 (stretched along theta, radians)
#           or ACB: copy-paste of training targets (Tong et al. 2024, src/augmentations/acb.py):
#             crops a training target with context, augments the patch with RandAugment
#             (num_ops ops from `ops`, magnitude 0..10) and blends it in at a random free spot
#             with T' = T/max(T), I' = T'*T + (1-T')*I. Each paste gets its own box.
#             Grid-search num_ops x magnitude (the paper's "auto" part), one run per point.
#             Ablation "box copy only": num_ops: 0, fusion: none.
#             ops: identity rotate flip scale brightness sharpness (default) contrast color
#                  shear_x shear_y posterize solarize autocontrast equalize
#   p:      probability per image
#   params: keyword arguments of the transform / effect function
# Images are uint8 (0..255); IR effects run on the grayscale channel.
# -----------------------------------------------------------------------------
augmentation:
  bbox:
    min_visibility: 0.3   # drop a box if less than 30% of it remains after a spatial transform
    clip: true
  pipeline:
    # --- copy-paste (put it first, so later transforms also act on the pasted targets) ---
    - {name: ACB, enabled: false, p: 1.0, params: {num_targets: 1, num_ops: 2, magnitude: 5, context: 0.5, min_context_px: 4, fusion: adaptive}}
    # --- geometric ---
    - {name: HorizontalFlip, enabled: true,  p: 0.5}
    - {name: VerticalFlip,   enabled: false, p: 0.5}
    - {name: Affine,         enabled: false, p: 0.5, params: {scale: [0.8, 1.2], translate_percent: [-0.1, 0.1], rotate: [-10, 10]}}
    # --- generic photometric ---
    - {name: RandomBrightnessContrast, enabled: false, p: 0.5, params: {brightness_limit: 0.15, contrast_limit: 0.2}}
    - {name: GaussNoise,     enabled: false, p: 0.5, params: {std_range: [0.01, 0.05]}}
    - {name: GaussianBlur,   enabled: false, p: 0.3, params: {blur_limit: [3, 5]}}
    - {name: CLAHE,          enabled: false, p: 0.3, params: {clip_limit: 2.0, tile_grid_size: [8, 8]}}
    # --- IR sensor effects ---
    - {name: ir.netd,                  enabled: false, p: 0.3, params: {sigma: 0.0159}}   # sigma relative to [0,1]
    - {name: ir.fpn,                   enabled: false, p: 0.3, params: {sigma_gain: 0.02, sigma_offset: 3.0, mode: pixel}}    # y = a*x + b + n; offsets/noise in grey values
    - {name: ir.fpn,                   enabled: false, p: 0.3, params: {sigma_offset: 3.0, mode: column}}                     # stripe noise
    - {name: ir.histogram_shift,       enabled: false, p: 0.3, params: {delta_limit: 30}}
    - {name: ir.histogram_compression, enabled: false, p: 0.3, params: {gamma_min: 0.3, gamma_max: 0.9}}
    - {name: ir.salt_and_pepper,       enabled: false, p: 0.2, params: {p: 0.005, q: 0.005}}
    - {name: ir.psf_blur,              enabled: false, p: 0.2, params: {sigma_0: 1.2, rho: 1.0}}               # optical blur (isotropic)
    - {name: ir.psf_blur,              enabled: false, p: 0.2, params: {sigma_0: 2.0, rho: 0.15, theta: 0.0}}  # motion blur (stretched)
